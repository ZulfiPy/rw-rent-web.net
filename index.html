<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RW-Rent</title>
    <meta name="description" content="Fleet and rental operations for RW-Rent: vehicles, rentals, drivers, customers and insurance cases in one place." />
    <!-- A private tool: no search engine lists it. A robot has to read the page to see this, so
         public/robots.txt refuses none; a messenger's robot reads the page for a link's preview. -->
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0A0A0B" />

    <!-- What a messenger shows for a sent link: the name, the sentence and the picture. The picture is
         made from brand/og-image.html by `node brand/make.cjs`. A messenger wants whole addresses. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RW-Rent" />
    <meta property="og:title" content="RW-Rent" />
    <meta property="og:description" content="Fleet and rental operations for RW-Rent: vehicles, rentals, drivers, customers and insurance cases in one place." />
    <meta property="og:url" content="https://rw-rent.net/" />
    <meta property="og:image" content="https://rw-rent.net/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RW-Rent. Control at every turn." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RW-Rent" />
    <meta name="twitter:description" content="Fleet and rental operations for RW-Rent: vehicles, rentals, drivers, customers and insurance cases in one place." />
    <meta name="twitter:image" content="https://rw-rent.net/og-image.png" />
    <meta name="twitter:image:alt" content="RW-Rent. Control at every turn." />

    <!-- The tab's icon, the iPhone's home-screen icon and the manifest: real files of public/. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Michroma&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Poppins:wght@600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
