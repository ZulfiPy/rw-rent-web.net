  takes its picture. Open the file in a browser to see it as it will be drawn.

  fifth opacity fading towards the middle, the monogram in the brand's red, the name in the wordmark's
  type (Poppins 600) and the sign-in page's line in the display type (Michroma). The colours are the
  dark theme's in src/styles/tokens.css; the monogram's two paths are AuthLayout.tsx's, and a test
